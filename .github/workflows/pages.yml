name: Deploy site to GitHub Pages

# Publishes the site/ folder straight from main — no separate branch.
# Live at: https://sharecursor.com/
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/generate-llms-full.mjs"
      - "scripts/validate-site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate site and generated content
        run: node scripts/validate-site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
