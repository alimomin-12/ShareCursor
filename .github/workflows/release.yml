name: Release

# Push a tag like v0.6.0 to build installers for every platform and attach
# them to a GitHub Release. End users just download — no Rust required.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without publishing (MAJOR.MINOR.PATCH)
        required: true
        default: "0.6.0"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Resolve and validate version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          node scripts/check-release-version.mjs "$VERSION"

  macos:
    name: macOS (.dmg, universal)
    needs: validate
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build ShareCursor.app + .dmg
        run: bash packaging/macos/build-app.sh "${{ needs.validate.outputs.version }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  windows:
    name: Windows (.exe installer)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --features tray,gui
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = "${{ needs.validate.outputs.version }}"
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$version" packaging\windows\sharecursor.iss
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: packaging/windows/Output/*.exe

  release:
    name: Publish GitHub Release
    needs: [validate, macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate checksums and package-manager manifests
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          node scripts/generate-release-packages.mjs \
            --version "$VERSION" \
            --windows "artifacts/windows-installer/ShareCursor-Setup-$VERSION.exe" \
            --macos "artifacts/macos-dmg/ShareCursor-$VERSION.dmg" \
            --out-dir artifacts/release-metadata
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/macos-dmg/*.dmg
            artifacts/windows-installer/*.exe
            artifacts/release-metadata/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## ShareCursor ${{ github.ref_name }}

            **Download & install — no Rust required:**
            * **macOS:** `ShareCursor-*.dmg` → open, drag ShareCursor to Applications.
              Then grant **Accessibility** + **Input Monitoring**.
            * **Windows:** `ShareCursor-Setup-*.exe` → run it (no admin needed).

            **Note: these builds are unsigned** (no paid certificate), so you'll see a
            one-time OS warning — normal for open-source apps.
            * **macOS** "app is damaged / can't be opened": open Terminal and run
              `xattr -cr /Applications/ShareCursor.app`, then launch it. (Or
              right-click the app → Open, or System Settings → Privacy & Security
              → Open Anyway.)
            * **Windows** SmartScreen: **More info → Run anyway**.

            Install help: https://github.com/phun333/ShareCursor/blob/main/docs/INSTALL.md

            **How to use it:** open the app (menu-bar / tray) → **Settings** → set
            the same passphrase + layout on both machines → **Start Server** on one,
            **Start Client** on the other. Full step-by-step (Mac + Windows):
            https://github.com/phun333/ShareCursor/blob/main/docs/USAGE.md
